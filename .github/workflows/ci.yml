name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "1.27.x"]
    steps:
      - name: Check out Kubernetes adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orbit-kubernetes-go
          persist-credentials: false
      - name: Check out discovery contract SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orbit-projects/orbit-discovery-go
          path: orbit-discovery-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: orbit-kubernetes-go/go.sum
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.1"
      - name: Test with race detector
        working-directory: orbit-kubernetes-go
        run: make test
      - name: Vet
        working-directory: orbit-kubernetes-go
        run: make vet
      - name: Build plugin
        working-directory: orbit-kubernetes-go
        run: make build
      - name: Verify generated bindings
        working-directory: orbit-kubernetes-go
        run: |
          make tools
          make generate
          git diff --exit-code -- internal/wire

  python-host-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kubernetes adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: orbit-kubernetes-go
          persist-credentials: false
      - name: Check out discovery contract SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orbit-projects/orbit-discovery-go
          path: orbit-discovery-go
          persist-credentials: false
      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orbit-projects/orbit-core
          path: orbit-core
          persist-credentials: false
      - name: Check out Python discovery capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orbit-projects/orbit-discovery
          path: orbit-discovery
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: orbit-kubernetes-go/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Python host dependencies
        working-directory: orbit-kubernetes-go
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv pip install --python "$(command -v python)" \
            -e "../orbit-core[process-plugins]" \
            -e "../orbit-discovery[process]" \
            pytest pytest-asyncio
      - name: Run Python Core to Go plugin conformance test
        working-directory: orbit-kubernetes-go
        run: make integration
